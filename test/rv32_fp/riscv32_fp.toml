# Sail RISC-V 32 位隔离测试配置，专用于需要 F/D 扩展的 clause。

pc = "PC"

zero_announce_exit = true

default_sizeof = 4

in_program_order = ["sail_barrier"]

[[toolchain]]
name = "macos-riscv64"
os = "macos"
arch = "aarch64"
assembler = "riscv64-elf-as"
objdump = "riscv64-elf-objdump"
nm = "riscv64-elf-nm"
linker = "riscv64-elf-ld"

[[toolchain]]
name = "default"
assembler = "riscv64-unknown-elf-as -march=rv32imafdc_zfa_zcf"
objdump = "riscv64-unknown-elf-objdump"
linker = "riscv64-unknown-elf-ld"
nm = "riscv64-unknown-elf-nm"

[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x300000"
s2_page_size = "4096"

[threads]
base = "0x80100000"
top = "0x80300000"
stride = "0x10000"

[symbolic_addrs]
base = "0x80310000"
top = "0x80410000"
stride = "0x10"

[registers]

[registers.defaults]
cur_privilege = "Machine"
"__isla_vector_gpr" = false
"__isla_vector_vpr" = false
"__isla_vector_fpr" = false
"__isla_use_extra_ops" = true
satp = "0x00000000"
misa = "{ bits = 0x4034112f }"
# 保留 VS=Dirty，并设置 FS=Dirty，使 F/D 与向量浮点扩展处于可执行状态。
mstatus = "{ bits = 0x0000000000006600 }"
mcountinhibit = " { bits = 0x00000000 }"
mcyclecfg = "{ bits = 0x0000000000000000 }"
minstretcfg = "{ bits = 0x0000000000000000 }"
mtimecmp = "0x0000000000000000"
stimecmp = "0x0000000000000000"

[const_primops]
get_config_print_reg = false
get_config_print_instr = false
get_config_print_platform = false
get_config_print_mem = false
# 仅供 RV32 隔离测试：启用 F/D，FS=Dirty；不用于正式 solve-state。
sys_enable_fdext = true
sys_enable_zfinx = false
sys_enable_rvc = true
sys_enable_next = false
sys_enable_vext = true
sys_enable_writable_fiom = true
sys_enable_writable_misa = true
sys_enable_bext = false
sys_enable_experimental_extensions = false
sys_pmp_count = "0 : %i64"
plat_enable_pmp = false
plat_enable_dirty_update = false
plat_enable_misaligned_access = false
plat_mtval_has_illegal_inst_bits = false
plat_insns_per_tick = 10
plat_ram_base = "0b0010000000000000000000000000000000"
plat_ram_size = "0b0000000100000000000000000000000000"
plat_rom_base = "0b0000000000000000000001000000000000"
plat_rom_size = "0b0000000000000000000000000100000000"
plat_clint_base = "0b0000000010000000000000000000000000"
plat_clint_size = "0b0000000000000011000000000000000000"
plat_htif_tohost = "0b0001000000000000000001000000000000"
plat_get_16_random_bits = "undefined : %bv16"
plat_term_write = "()"
print_reg = "()"
print_platform = "()"
print_instr = "()"
print_mem_access = "()"
speculate_conditional = "undefined : %bool"
match_reservation = "true"
cancel_reservation = "()"
load_reservation = "()"
csr_full_write_callback = "()"
mem_read_callback = "()"
xreg_full_write_callback = "()"
mem_write_callback = "()"
mem_exception_callback = "()"
pc_write_callback = "()"
get_config_rvfi = "false"
plat_enable_htif = "false"
get_config_use_abi_names = "false"
